<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:#0C0E13;color:#F2F4F8;-webkit-font-smoothing:antialiased}
    a{color:#C8F542}a:hover{color:#DAFF6B}
    button{font-family:inherit;cursor:pointer}
    input{font-family:inherit}
    .h{font-family:'Space Grotesk','Manrope',sans-serif}
    .btn{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:16px;font-weight:700;font-size:15px;border:none;width:100%}
    .acc{background:#C8F542;color:#111505}
    .ghost{background:#181D2A;color:#F2F4F8;border:1px solid #29304A}
    .in{height:54px;border-radius:16px;border:1px solid #29304A;background:#12151F;color:#F2F4F8;padding:0 16px;font-size:15px;outline:none;width:100%}
    .in::placeholder{color:#5E6678}
    .in:focus{border-color:#C8F542}
    .tab{flex:1;height:44px;border-radius:12px;border:none;background:none;color:#8B93A7;font-weight:700;font-size:14px}
    .tab.on{background:#232A3E;color:#F2F4F8}
    .lbl{font-size:13px;font-weight:700;color:#AEB6C8;margin:0 0 8px}
  </style>
</helmet>
<div style="width:390px;height:844px;background:#0C0E13;display:flex;flex-direction:column;overflow-y:auto;padding:56px 24px 28px">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:28px">
    <div style="width:40px;height:40px;border-radius:13px;background:#C8F542;display:flex;align-items:center;justify-content:center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111505" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 21s-7-5.6-7-11a7 7 0 0 1 14 0c0 5.4-7 11-7 11z"></path>
        <circle cx="12" cy="10" r="2.6"></circle>
      </svg>
    </div>
    <span class="h" style="font-size:20px;font-weight:700">Burada</span>
  </div>

  <h1 class="h" style="margin:0 0 6px;font-size:28px;font-weight:700;letter-spacing:-.5px">{{ heading }}</h1>
  <p style="margin:0 0 24px;font-size:14px;color:#8B93A7">{{ sub }}</p>

  <div style="display:flex;background:#12151F;border:1px solid #1E2434;border-radius:16px;padding:4px;gap:4px;margin-bottom:24px">
    <button class="tab {{ inCls }}" onClick="{{ goIn }}">Giri&#351; yap</button>
    <button class="tab {{ upCls }}" onClick="{{ goUp }}">Kay&#305;t ol</button>
  </div>

  <div style="display:flex;flex-direction:column;gap:14px">
    <sc-if value="{{ isUp }}" hint-placeholder-val="{{ true }}">
      <div>
        <p class="lbl">Ad&#305;n</p>
        <input class="in" type="text" placeholder="Mekanda g&#246;r&#252;necek ad&#305;n">
      </div>
    </sc-if>
    <div>
      <p class="lbl">E-posta</p>
      <input class="in" type="email" placeholder="ornek@eposta.com">
    </div>
    <div>
      <p class="lbl">&#350;ifre</p>
      <input class="in" type="password" placeholder="En az 8 karakter">
    </div>
  </div>

  <sc-if value="{{ isIn }}" hint-placeholder-val="{{ true }}">
    <p style="margin:12px 0 0;text-align:right;font-size:13px"><a href="#">&#350;ifremi unuttum</a></p>
  </sc-if>

  <div style="margin-top:24px;display:flex;flex-direction:column;gap:12px">
    <button class="btn acc">{{ cta }}</button>
    <div style="display:flex;align-items:center;gap:12px;margin:6px 0">
      <div style="flex:1;height:1px;background:#1E2434"></div>
      <span style="font-size:12px;color:#5E6678;font-weight:600">veya</span>
      <div style="flex:1;height:1px;background:#1E2434"></div>
    </div>
    <button class="btn ghost">Google ile devam et</button>
  </div>

  <sc-if value="{{ isUp }}" hint-placeholder-val="{{ true }}">
    <p style="margin:auto 0 0;padding-top:20px;text-align:center;font-size:12px;line-height:1.6;color:#5E6678">Kay&#305;t olarak <a href="#">Kullan&#305;m Ko&#351;ullar&#305;</a> ve <a href="#">Gizlilik Politikas&#305;</a>&#8217;n&#305; kabul edersin. Konumun yaln&#305;zca check-in yaparken kullan&#305;l&#305;r.</p>
  </sc-if>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const mode = (this.state && this.state.mode) || 'up';
    const isUp = mode === 'up';
    return {
      isUp,
      isIn: !isUp,
      inCls: isUp ? '' : 'on',
      upCls: isUp ? 'on' : '',
      heading: isUp ? 'Aramıza katıl' : 'Tekrar hoş geldin',
      sub: isUp ? 'Bir dakikadan kısa sürer.' : 'Seni görmeyeli mekanlar boş kaldı.',
      cta: isUp ? 'Hesap oluştur' : 'Giriş yap',
      goIn: () => this.setState({ mode: 'in' }),
      goUp: () => this.setState({ mode: 'up' }),
    };
  }
}
</script>
</body>
</html>
