<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:#0C0E13;color:#F2F4F8;-webkit-font-smoothing:antialiased}
    a{color:#C8F542}a:hover{color:#DAFF6B}
    button{font-family:inherit;cursor:pointer}
    .h{font-family:'Space Grotesk','Manrope',sans-serif}
    .sec{background:#12151F;border:1px solid #1E2434;border-radius:20px;overflow:hidden}
    .srow{display:flex;align-items:center;gap:14px;padding:8px 18px;min-height:64px;border-bottom:1px solid #171C29}
    .srow:last-child{border-bottom:none}
    .tgl{width:64px;height:44px;background:none;border:none;display:flex;align-items:center;justify-content:flex-end;padding:0}
    .track{width:52px;height:32px;border-radius:16px;padding:3px;display:flex;transition:.2s}
    .track.on{background:#C8F542;justify-content:flex-end}
    .track.off{background:#29304A;justify-content:flex-start}
    .knob{width:26px;height:26px;border-radius:13px;background:#F2F4F8}
    .track.on .knob{background:#111505}
    .stitle{margin:0 0 10px;font-size:12px;font-weight:800;color:#5E6678;letter-spacing:1.2px;text-transform:uppercase}
    .nav{display:flex;border-top:1px solid #1E2434;background:#0E1119;padding:10px 12px 26px}
    .nvi{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#6B7390;background:none;border:none;height:56px;justify-content:center}
    .nvi.on{color:#C8F542}
  </style>
</helmet>
<div style="width:390px;height:844px;background:#0C0E13;display:flex;flex-direction:column;overflow:hidden">
  <div style="flex:1;overflow-y:auto;padding:64px 24px 24px;display:flex;flex-direction:column;gap:22px">
    <h1 class="h" style="margin:0;font-size:30px;font-weight:700;letter-spacing:-.6px">Profil</h1>

    <div class="sec" style="display:flex;align-items:center;gap:14px;padding:18px">
      <div style="width:64px;height:64px;border-radius:24px;background:rgba(200,245,66,.14);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;color:#C8F542;font-family:'Space Grotesk',sans-serif;flex:none">O</div>
      <div style="flex:1;min-width:0">
        <p style="margin:0 0 3px;font-size:17px;font-weight:800">Or&#231;un</p>
        <p style="margin:0;font-size:12px;color:#8B93A7">Bu ay 9 check-in &#183; 14 yeni ki&#351;i</p>
      </div>
      <button style="height:44px;padding:0 16px;border-radius:14px;background:#181D2A;border:1px solid #29304A;color:#F2F4F8;font-weight:800;font-size:13px;flex:none">D&#252;zenle</button>
    </div>

    <div>
      <p class="stitle">G&#246;r&#252;n&#252;rl&#252;k</p>
      <div class="sec">
        <sc-for list="{{ visToggles }}" as="t" hint-placeholder-count="2">
          <div class="srow">
            <div style="flex:1;min-width:0">
              <p style="margin:0 0 3px;font-size:14px;font-weight:800">{{ t.label }}</p>
              <p style="margin:0;font-size:12px;color:#8B93A7;line-height:1.45">{{ t.desc }}</p>
            </div>
            <button class="tgl" onClick="{{ t.flip }}">
              <span class="track {{ t.cls }}"><span class="knob"></span></span>
            </button>
          </div>
        </sc-for>
      </div>
    </div>

    <div>
      <p class="stitle">Bildirim &amp; Konum</p>
      <div class="sec">
        <sc-for list="{{ sysToggles }}" as="t" hint-placeholder-count="2">
          <div class="srow">
            <div style="flex:1;min-width:0">
              <p style="margin:0 0 3px;font-size:14px;font-weight:800">{{ t.label }}</p>
              <p style="margin:0;font-size:12px;color:#8B93A7;line-height:1.45">{{ t.desc }}</p>
            </div>
            <button class="tgl" onClick="{{ t.flip }}">
              <span class="track {{ t.cls }}"><span class="knob"></span></span>
            </button>
          </div>
        </sc-for>
      </div>
    </div>

    <div class="sec">
      <button class="srow" style="width:100%;background:none;border:none;border-bottom:1px solid #171C29;text-align:left;color:#F2F4F8;font-size:14px;font-weight:800">
        Engellenenler
        <span style="margin-left:auto;color:#5E6678">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5l7 7-7 7"></path></svg>
        </span>
      </button>
      <button class="srow" style="width:100%;background:none;border:none;text-align:left;color:#FF6B87;font-size:14px;font-weight:800">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF6B87" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3"></path><path d="M15 16l4-4-4-4"></path><path d="M19 12H9"></path></svg>
        &#199;&#305;k&#305;&#351; yap
      </button>
    </div>
  </div>

  <div class="nav">
    <button class="nvi">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5 5-2z"></path></svg>
      Ke&#351;fet
    </button>
    <button class="nvi">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8a2.5 2.5 0 0 1-2.5 2.5H9l-5 4v-14z"></path></svg>
      Sohbetler
    </button>
    <button class="nvi on">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20a7 7 0 0 1 14 0"></path></svg>
      Profil
    </button>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const defaults = { gorunur: true, sadece: true, bildirim: true, arkaplan: false };
    const st = (this.state && this.state.tg) || defaults;
    const mk = (key, label, desc) => ({
      label,
      desc,
      cls: st[key] ? 'on' : 'off',
      flip: () => this.setState({ tg: { ...st, [key]: !st[key] } }),
    });
    return {
      visToggles: [
        mk('gorunur', 'Check-in’de görünür ol', 'Kapatırsan mekandaki listede çıkmazsın; sen yine herkesi görürsün.'),
        mk('sadece', 'Sadece eklediklerim mesaj atsın', 'Tanımadıklarından gelen mesajlar istek kutusuna düşer.'),
      ],
      sysToggles: [
        mk('bildirim', 'Bildirimler', 'İstek, mesaj ve yakındaki mekan bildirimleri.'),
        mk('arkaplan', 'Arka planda konum', 'Kapalıyken konum yalnızca uygulama açıkken kullanılır.'),
      ],
    };
  }
}
</script>
</body>
</html>
