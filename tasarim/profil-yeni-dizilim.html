<style>
  :root{
    --zemin:#FFFFFF; --metin:#17130F; --ikincil:#6E6660; --soluk:#A39B93;
    --turuncu:#FE7813; --turuncuZemin:#FFF3E8; --cizgi:#DCD3C9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#B8B2AC;font-family:'Instrument Sans',system-ui,sans-serif;
       display:flex;gap:28px;padding:28px;align-items:flex-start}
  .telefon{width:390px;background:var(--zemin);border-radius:22px;overflow:hidden;
           box-shadow:0 10px 34px rgba(0,0,0,.22)}
  .etiket{font:600 13px 'Instrument Sans';color:#3A3430;margin:0 0 8px 4px;letter-spacing:.02em}
  .sayfa{padding:0 16px 18px;position:relative}
  /* HARITA ZEMINI: yalnizca UST BLOGU kapliyor, cok soluk, ISIMSIZ.
     Geometri OpenStreetMap (ODbL) - karsilama ekraniyla ayni kaynak. */
  /* "Profili düzenle" butonunun USTUNDE bitiyor; asagi tasmiyor. */
  .haritaKap{position:absolute;left:0;right:0;top:0;height:152px;overflow:hidden;
             opacity:.18;pointer-events:none;
             -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 55%,transparent 100%);
             mask-image:linear-gradient(180deg,#000 0%,#000 55%,transparent 100%)}
  .haritaZemin{width:100%;height:100%;display:block}
  .ust,.kimlik,.eylemler{position:relative}

  /* --- UST CUBUK --- */
  .ust{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px}

  .kimlik{display:flex;align-items:center;gap:16px;padding:6px 0 16px}
  .avatarKap{position:relative;flex:none}
  .avatar{width:78px;height:78px;border-radius:50%;object-fit:cover;display:block}
  .rozet{position:absolute;right:-2px;bottom:-2px;width:28px;height:28px;border-radius:50%;
         background:var(--turuncu);display:grid;place-items:center;border:2.5px solid #fff}
  .bilgi{min-width:0;flex:1}
  .ad{font:700 21px 'Instrument Sans';color:var(--metin);letter-spacing:-.3px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kad{font:400 14px 'Instrument Sans';color:var(--soluk);margin-top:1px}
  .bio{font:400 14px 'Instrument Sans';color:var(--ikincil);margin-top:5px;line-height:1.35}

  /* --- EYLEM SATIRI --- */
  .eylemler{display:flex;gap:10px}
  .duzenle{flex:1;height:46px;border-radius:13px;background:var(--turuncuZemin);
           display:grid;place-items:center;font:600 15px 'Instrument Sans';color:var(--metin)}
  .paylas{width:56px;height:46px;border-radius:13px;background:var(--turuncuZemin);
          display:grid;place-items:center}

  /* --- SAYACLAR (degismedi) --- */
  /* SAYACLAR ARTIK KART ICINDE (referans). Ayrimi kenarlik + golge
     tasiyor: sayfa zemini de kart da beyaz. */
  .sayacKart{display:flex;background:#fff;border-radius:16px;border:1px solid var(--cizgi);
             box-shadow:0 2px 10px rgba(23,19,15,.05);margin-top:18px;padding:14px 0 12px}
  .sayac{flex:1;text-align:center;position:relative}
  .sayac + .sayac::before{content:'';position:absolute;left:0;top:6px;bottom:6px;
                          width:1px;background:var(--cizgi)}
  .sIkon{width:26px;height:26px;object-fit:contain}
  .sSayi{font:700 21px 'Instrument Sans';color:var(--metin);margin-top:5px;letter-spacing:-.2px}
  .sSayiSecili{color:var(--turuncu)}
  .sEtiket{font:400 13px 'Instrument Sans';color:var(--ikincil);margin-top:1px}
  .sEtiketSecili{color:var(--metin);font-weight:600}

  /* --- SEKME HAPI (degismedi) --- */
  /* SEKMELER: HAP DEGIL ALT CIZGI (referans). Secili olanin altinda
     kalin turuncu, tabanda ince gri tam genislik cizgi. */
  .sekmeler{display:flex;margin-top:20px;border-bottom:1px solid var(--cizgi)}
  .sekme{flex:1;text-align:center;padding:12px 0 11px;
         font:600 15px 'Instrument Sans';color:var(--soluk);position:relative}
  .sekmeSecili{color:var(--turuncu)}
  .sekmeSecili::after{content:'';position:absolute;left:22%;right:22%;bottom:-1px;
                      height:3px;border-radius:2px;background:var(--turuncu)}
</style>
