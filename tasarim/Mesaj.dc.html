<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:#0C0E13;color:#F2F4F8;-webkit-font-smoothing:antialiased}
    a{color:#C8F542}a:hover{color:#DAFF6B}
    button{font-family:inherit;cursor:pointer}
    input{font-family:inherit}
    .h{font-family:'Space Grotesk','Manrope',sans-serif}
    .bub{max-width:75%;padding:12px 16px;border-radius:20px;font-size:14px;line-height:1.5}
    .them{background:#1A2030;color:#F2F4F8;border-bottom-left-radius:6px;align-self:flex-start}
    .me{background:#C8F542;color:#111505;border-bottom-right-radius:6px;align-self:flex-end;font-weight:600}
  </style>
</helmet>
<div style="width:390px;height:844px;background:#0C0E13;display:flex;flex-direction:column;overflow:hidden">
  <div style="padding:56px 20px 14px;background:#10131C;border-bottom:1px solid #1E2434;display:flex;align-items:center;gap:12px">
    <button style="width:44px;height:44px;border-radius:15px;background:#181D2A;border:1px solid #29304A;display:flex;align-items:center;justify-content:center;flex:none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2F4F8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5l-7 7 7 7"></path></svg>
    </button>
    <div style="width:46px;height:46px;border-radius:17px;background:rgba(255,123,169,.14);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#FF7BA9;flex:none">E</div>
    <div style="flex:1;min-width:0">
      <p class="h" style="margin:0 0 2px;font-size:17px;font-weight:700">Elif</p>
      <p style="margin:0;font-size:11px;font-weight:700;color:#C8F542;display:flex;align-items:center;gap:5px">
        <span style="width:7px;height:7px;border-radius:4px;background:#C8F542;display:inline-block"></span>
        &#350;u an Kafe Mola&#8217;da
      </p>
    </div>
  </div>

  <div style="flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:10px">
    <div style="align-self:center;font-size:11px;font-weight:700;color:#8B93A7;background:#12151F;border:1px solid #1E2434;border-radius:12px;padding:7px 14px;display:flex;align-items:center;gap:6px;margin-bottom:6px">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#9D7BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.6-7-11a7 7 0 0 1 14 0c0 5.4-7 11-7 11z"></path><circle cx="12" cy="10" r="2.6"></circle></svg>
      Kafe Mola&#8217;da tan&#305;&#351;t&#305;n&#305;z &#183; bug&#252;n
    </div>
    <sc-for list="{{ msgs }}" as="m" hint-placeholder-count="5">
      <div class="bub {{ m.cls }}">{{ m.text }}</div>
    </sc-for>
  </div>

  <div style="padding:12px 16px 32px;border-top:1px solid #1E2434;background:#0E1119;display:flex;align-items:center;gap:10px">
    <input value="{{ draft }}" onInput="{{ onDraft }}" placeholder="Mesaj yaz..." style="flex:1;height:50px;border-radius:16px;border:1px solid #29304A;background:#12151F;color:#F2F4F8;padding:0 16px;font-size:14px;outline:none">
    <button onClick="{{ send }}" style="width:50px;height:50px;border-radius:16px;background:#C8F542;border:none;display:flex;align-items:center;justify-content:center;flex:none">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#111505" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3L10 14"></path><path d="M21 3l-7 18-3-7-7-3 17-8z"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const seed = [
      { me: false, text: 'Selam! Sen de mi Mola’dasın?' },
      { me: true, text: 'Evet, cam kenarındayım :)' },
      { me: false, text: 'Playlist’i kim seçiyor bilmiyorum ama harika' },
      { me: true, text: 'Değil mi! Konser bileti aldın mı bu arada?' },
      { me: false, text: 'Bugün alıyorum, sen?' },
    ];
    const msgs = (st.msgs || seed).map((m) => ({ ...m, cls: m.me ? 'me' : 'them' }));
    const draft = st.draft || '';
    return {
      msgs,
      draft,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      send: () => {
        if (!draft.trim()) return;
        this.setState({ msgs: [...(st.msgs || seed), { me: true, text: draft.trim() }], draft: '' });
      },
    };
  }
}
</script>
</body>
</html>
