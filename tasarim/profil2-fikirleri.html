<!doctype html>
<meta charset="utf-8">
<title>Slooin — profil ekranı, ikinci tur</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #2a2622; font-family: 'Instrument Sans', system-ui, sans-serif; padding: 24px; }

  .telefon { position: relative; width: 390px; height: 844px; overflow: hidden;
             background: #fff; display: flex; flex-direction: column; }
  .govde { flex: 1; overflow: hidden; }

  .ustSatir { display: flex; align-items: center; justify-content: space-between;
              padding: 26px 20px 16px; }
  .kullaniciAdi { font-size: 19px; font-weight: 700; color: #17130F; letter-spacing: -0.3px; }

  /* --- turuncu band --- */
  .band { background: #FE7813; padding: 24px 20px 16px; }
  .band.dar { padding: 18px 20px 14px; }
  .avatar { width: 104px; height: 104px; border-radius: 999px; background: #fff;
            display: grid; place-items: center; font-size: 34px; font-weight: 700;
            color: #FE7813; margin: 0 auto; position: relative; }
  .avatar.kucuk { width: 76px; height: 76px; font-size: 26px; margin: 0; }
  .ad { font-size: 19px; font-weight: 600; color: #fff; text-align: center; margin-top: 14px; }
  .bio { font-size: 13px; color: rgba(255,255,255,.85); text-align: center; margin-top: 3px; }
  .sayilar { display: flex; align-items: center; margin-top: 18px; }
  .sayilar > div { flex: 1; text-align: center; }
  .sayilar .s { font-size: 19px; font-weight: 700; color: #fff; letter-spacing: -0.4px; }
  .sayilar .e { font-size: 13px; color: rgba(255,255,255,.85); margin-top: 2px; }
  .ayirici { flex: none !important; width: 1px; height: 28px; background: rgba(255,255,255,.35); }

  .bandDugmeleri { display: flex; gap: 8px; margin-top: 16px; }
  .bandDugme { flex: 1; text-align: center; padding: 9px 0; border-radius: 10px;
               font-size: 14px; font-weight: 600; color: #fff;
               border: 1px solid rgba(255,255,255,.55); }
  .bandDugme.dolu { background: #fff; color: #E06509; border-color: #fff; }

  .satirBand { display: flex; align-items: center; gap: 16px; }
  .satirBand .buyu { flex: 1; }
  .satirBand .ad { text-align: left; margin: 0; }
  .satirBand .bio { text-align: left; }

  /* --- canli kart bandin icinde --- */
  .canliKutu { background: rgba(255,255,255,.18); border-radius: 14px; padding: 12px 14px;
               margin-top: 16px; display: flex; align-items: center; gap: 12px; }
  .canliKutu .nokta { width: 8px; height: 8px; border-radius: 999px; background: #fff; }
  .canliKutu .yer { font-size: 15px; font-weight: 600; color: #fff; }
  .canliKutu .alt { font-size: 12px; color: rgba(255,255,255,.85); margin-top: 1px; }
  .canliKutu .ayril { font-size: 13px; font-weight: 600; color: #fff;
                      border: 1px solid rgba(255,255,255,.55); border-radius: 999px;
                      padding: 5px 12px; white-space: nowrap; }

  /* --- sekmeler --- */
  .sekmeler { display: flex; border-bottom: 1px solid #EFEAE5; }
  .sekmeler div { flex: 1; text-align: center; padding: 12px 0; font-size: 14px;
                  font-weight: 600; color: #A39B93; }
  .sekmeler div.aktif { color: #17130F; box-shadow: inset 0 -2px 0 #17130F; }

  /* --- tunel --- */
  .icerik { padding: 0 20px; }
  .baslikSatiri { display: flex; align-items: center; justify-content: space-between;
                  margin: 16px 0 8px; }
  .baslik { font-size: 20px; font-weight: 700; color: #17130F; letter-spacing: -0.3px; }
  .tumu { font-size: 14px; font-weight: 600; color: #17130F; }
  .tunel { padding-left: 40px; position: relative; }
  .tunel:before { content: ''; position: absolute; left: 15px; top: 8px; bottom: 8px;
                  width: 2px; background: #FFD9B8; }
  .gun { display: inline-block; position: relative; z-index: 1; font-size: 11px;
         font-weight: 600; color: #6E6660; background: #F6F1EB; border-radius: 999px;
         padding: 4px 10px; margin: 12px 0 8px -40px; }
  .ani { position: relative; margin-bottom: 16px; }
  .ani .isaret { position: absolute; left: -40px; top: 0; width: 30px; height: 30px;
                 border-radius: 999px; background: #FE7813; border: 3px solid #fff;
                 display: grid; place-items: center; }
  .ani .yer { font-size: 15px; font-weight: 600; color: #17130F; }
  .ani .alt { font-size: 13px; color: #6E6660; margin-top: 2px; }
  .ani .not { font-size: 15px; color: #17130F; margin-top: 6px; }

  /* --- yerler listesi --- */
  .yerSatiri { display: flex; align-items: center; gap: 12px; padding: 12px 0;
               border-bottom: 1px solid #EFEAE5; }
  .yerSatiri .no { width: 26px; font-size: 13px; font-weight: 700; color: #A39B93; }
  .yerSatiri .buyu { flex: 1; }
  .yerSatiri .ad2 { font-size: 15px; font-weight: 600; color: #17130F; }
  .yerSatiri .semt { font-size: 13px; color: #6E6660; margin-top: 1px; }
  .yerSatiri .adet { font-size: 13px; font-weight: 600; color: #E06509;
                     background: #FFF3E8; border-radius: 999px; padding: 4px 10px; }

  /* --- gezinme --- */
  .gezinme { height: 84px; margin: 0 12px 14px; background: #fff; border-radius: 28px;
             display: flex; align-items: center; justify-content: space-around;
             box-shadow: 0 8px 24px rgba(23,19,15,.10); }
  .gezinme svg { width: 26px; height: 26px; }
  .gezinme .checkin { width: 58px; height: 58px; border-radius: 999px; background: #FE7813;
                      display: grid; place-items: center; margin-top: -22px;
                      box-shadow: 0 8px 18px rgba(254,120,19,.35); }
  .gezinme .checkin svg { width: 28px; height: 28px; }

  .etiket-sat { color: #FAF7F3; font-size: 15px; font-weight: 600; margin: 0 0 10px;
                display: flex; align-items: baseline; gap: 10px; }
  .etiket-sat i { color: #FE7813; font-style: normal; font-weight: 700; }
  .etiket-sat small { color: #a49b92; font-weight: 400; font-size: 13px; }
  .tahta > div.telefon { margin-bottom: 40px; }
</style>

<div id="tahta" class="tahta"></div>

<script>
  const I = {
    disli: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#17130F" stroke-width="1.7"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 14.5a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-2.9 1.2v.18a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.96-1.14l-.06.06A2 2 0 1 1 4.16 16.4l.06-.06A1.7 1.7 0 0 0 3.08 13.5H2.9a2 2 0 1 1 0-4H3a1.7 1.7 0 0 0 1.14-2.96l-.06-.06A2 2 0 1 1 6.9 3.65l.06.06a1.7 1.7 0 0 0 2.9-1.2V2.4a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0 1.2 2.9h.18a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.47 1z"/></svg>',
    ev: '<svg viewBox="0 0 24 24" fill="none" stroke="#A39B93" stroke-width="1.9"><path d="M3.5 10.5 12 3.6l8.5 6.9V20a.9.9 0 0 1-.9.9h-4.3v-6h-6.6v6H4.4a.9.9 0 0 1-.9-.9z" stroke-linejoin="round"/></svg>',
    kisiler: '<svg viewBox="0 0 24 24" fill="none" stroke="#A39B93" stroke-width="1.9"><circle cx="9" cy="8" r="3.3"/><path d="M2.8 19.6c0-3.4 2.8-5.6 6.2-5.6s6.2 2.2 6.2 5.6" stroke-linecap="round"/><path d="M16.4 6.2a2.9 2.9 0 0 1 0 5.6M18 14.6c2 .6 3.3 2.4 3.3 5" stroke-linecap="round"/></svg>',
    sohbet: '<svg viewBox="0 0 24 24" fill="none" stroke="#A39B93" stroke-width="1.9"><path d="M3.6 5.4h16.8v10.2H9L3.6 19.6z" stroke-linejoin="round"/></svg>',
    profil: '<svg viewBox="0 0 24 24" fill="none" stroke="#FE7813" stroke-width="1.9"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20.4c0-3.9 3.2-6.4 7.2-6.4s7.2 2.5 7.2 6.4" stroke-linecap="round"/></svg>',
    igne: '<svg viewBox="0 0 24 24"><path d="M12 2.4a7.4 7.4 0 0 0-7.4 7.4c0 5.5 7.4 11.8 7.4 11.8s7.4-6.3 7.4-11.8A7.4 7.4 0 0 0 12 2.4z" fill="#fff"/><circle cx="12" cy="9.7" r="2.8" fill="#FE7813"/></svg>',
    igneKucuk: '<svg width="15" height="15" viewBox="0 0 24 24"><path d="M12 2.4a7.4 7.4 0 0 0-7.4 7.4c0 5.5 7.4 11.8 7.4 11.8s7.4-6.3 7.4-11.8A7.4 7.4 0 0 0 12 2.4z" fill="#fff"/><circle cx="12" cy="9.7" r="2.8" fill="#FE7813"/></svg>',
  }

  const gez = `<div class="gezinme">${I.ev}${I.kisiler}<div class="checkin">${I.igne}</div>${I.sohbet}${I.profil}</div>`
  const tel = (no, ic) => `<div class="telefon" id="s${no}"><div class="govde">${ic}</div>${gez}</div>`
  const ust = `<div class="ustSatir"><div class="kullaniciAdi">@deniz</div>${I.disli}</div>`

  const ANILAR = [
    ['Bugün', 'Kahve Durağı', 'Nilüfer · 14:41', 'Sabah kalabalığı bitmiş, güzel oldu.'],
    ['Bugün', 'Sahil Yürüyüş Yolu', 'Nilüfer · 12:28', ''],
    ['Dün', 'Kent Meydanı', 'Osmangazi · 19:23', 'Konser vardı, tesadüfen denk geldim.'],
  ]
  function tunel(adet = 3) {
    let onceki = null
    return `<div class="tunel">${ANILAR.slice(0, adet).map(([g, y, a, n]) => {
      const ayrac = g !== onceki ? `<div class="gun">${g}</div>` : ''
      onceki = g
      return `${ayrac}<div class="ani"><div class="isaret">${I.igneKucuk}</div>
        <div class="yer">${y}</div><div class="alt">${a}</div>
        ${n ? `<div class="not">${n}</div>` : ''}</div>`
    }).join('')}</div>`
  }

  const anilarBasligi = `<div class="baslikSatiri"><div class="baslik">Anılar</div><div class="tumu">Tümü</div></div>`

  // ---- 1. UC SAYI + DUZENLE -----------------------------------------
  // En kucuk degisiklik, en somut kazanc. "Yer" sayisi mevcut
  // check-in verisinden hesaplanabiliyor. Profili duzenle simdi
  // Ayarlar'in icinde gomulu; band icine cikiyor.
  const p1 = ust + `
    <div class="band">
      <div class="avatar">D</div>
      <div class="ad">Deniz Yılmaz</div>
      <div class="bio">Kahve, uzun yürüyüşler.</div>
      <div class="sayilar">
        <div><div class="s">24</div><div class="e">Anı</div></div>
        <div class="ayirici"></div>
        <div><div class="s">11</div><div class="e">Yer</div></div>
        <div class="ayirici"></div>
        <div><div class="s">18</div><div class="e">Arkadaş</div></div>
      </div>
      <div class="bandDugmeleri">
        <div class="bandDugme dolu">Profili düzenle</div>
        <div class="bandDugme">Paylaş</div>
      </div>
    </div>
    <div class="icerik">${anilarBasligi}${tunel(2)}</div>`

  // ---- 2. SEKMELI: ANILAR / YERLER -----------------------------------
  // Ayni veri iki bakisla: zaman sirasi (anilar) ve yer sirasi
  // (en cok gittiklerin). Ikincisi bu uygulamaya ozgu.
  const p2 = ust + `
    <div class="band dar">
      <div class="satirBand">
        <div class="avatar kucuk">D</div>
        <div class="buyu">
          <div class="ad">Deniz Yılmaz</div>
          <div class="bio">24 anı · 11 yer · 18 arkadaş</div>
        </div>
      </div>
      <div class="bandDugmeleri"><div class="bandDugme dolu">Profili düzenle</div></div>
    </div>
    <div class="sekmeler"><div class="aktif">Anılar</div><div>Yerler</div></div>
    <div class="icerik">${tunel(3)}</div>`

  // ---- 3. YERLER SEKMESI ACIK ---------------------------------------
  // 2'nin ikinci sekmesi nasil gorunur: en cok gidilen yerler,
  // sayilariyla. Hepsi check-in verisinden hesaplanabiliyor.
  const p3 = ust + `
    <div class="band dar">
      <div class="satirBand">
        <div class="avatar kucuk">D</div>
        <div class="buyu">
          <div class="ad">Deniz Yılmaz</div>
          <div class="bio">24 anı · 11 yer · 18 arkadaş</div>
        </div>
      </div>
      <div class="bandDugmeleri"><div class="bandDugme dolu">Profili düzenle</div></div>
    </div>
    <div class="sekmeler"><div>Anılar</div><div class="aktif">Yerler</div></div>
    <div class="icerik">
      ${[
        ['Kahve Durağı', 'Nilüfer', '7 kez'],
        ['Sahil Yürüyüş Yolu', 'Nilüfer', '5 kez'],
        ['Kent Meydanı', 'Osmangazi', '3 kez'],
        ['Uludağ Üniversitesi', 'Nilüfer', '3 kez'],
        ['Zafer Plaza', 'Osmangazi', '2 kez'],
      ].map(([a, s, k], i) => `<div class="yerSatiri">
        <div class="no">${i + 1}</div>
        <div class="buyu"><div class="ad2">${a}</div><div class="semt">${s}</div></div>
        <div class="adet">${k}</div>
      </div>`).join('')}
    </div>`

  // ---- 4. CANLI DURUM BANDIN ICINDE ---------------------------------
  // Check-in aktifken band degisiyor: sayilar yerine "su an
  // buradasin" kutusu ve ayril dugmesi. Uygulamanin tek sorusu
  // profilde de en ustte cevaplaniyor.
  const p4 = ust + `
    <div class="band">
      <div class="satirBand">
        <div class="avatar kucuk">D</div>
        <div class="buyu">
          <div class="ad">Deniz Yılmaz</div>
          <div class="bio">24 anı · 11 yer · 18 arkadaş</div>
        </div>
      </div>
      <div class="canliKutu">
        <div class="nokta"></div>
        <div class="buyu">
          <div class="yer">Kahve Durağı</div>
          <div class="alt">Nilüfer · 42 dakikadır · 7 kişi burada</div>
        </div>
        <div class="ayril">Ayrıl</div>
      </div>
    </div>
    <div class="icerik">${anilarBasligi}${tunel(2)}</div>`

  // ---- 5. SADE BAND -------------------------------------------------
  // Ters yon: band KUCULUYOR. Avatar, ad ve tek satir ozet. Ekranin
  // capasi anilar oluyor, kimlik degil. En cok icerik gosteren hal.
  const p5 = ust + `
    <div class="band dar">
      <div class="satirBand">
        <div class="avatar kucuk">D</div>
        <div class="buyu">
          <div class="ad">Deniz Yılmaz</div>
          <div class="bio">Kahve, uzun yürüyüşler.</div>
        </div>
        <div class="bandDugme" style="flex:none;padding:8px 14px">Düzenle</div>
      </div>
    </div>
    <div class="icerik">
      <div class="baslikSatiri">
        <div class="baslik">24 anı · 11 yer</div>
        <div class="tumu">Tümü</div>
      </div>
      ${tunel(3)}
    </div>`

  const SECENEKLER = [
    ['1', 'Üç sayı + düzenle', 'en küçük değişiklik, en somut kazanç', p1],
    ['2', 'Sekmeli profil', 'Anılar / Yerler; band daralıyor', p2],
    ['3', 'Yerler sekmesi', '2 numaranın ikinci sekmesi', p3],
    ['4', 'Canlı durum bandın içinde', 'check-in varken band değişiyor', p4],
    ['5', 'Sade band', 'ters yön: kimlik küçülür, içerik büyür', p5],
  ]

  document.getElementById('tahta').innerHTML = SECENEKLER.map(([no, ad, not, ic]) =>
    `<div class="etiket-sat"><i>${no}</i> ${ad} <small>${not}</small></div>${tel(no, ic)}`
  ).join('')
</script>
