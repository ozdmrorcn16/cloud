<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Instrument Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #E85D0F; } a:hover { color: #c74d0a; }
    @keyframes slooinPuls { 0% { transform: scale(1); opacity: 0.45; } 100% { transform: scale(1.85); opacity: 0; } }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #FFFFFF; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden">

  <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 116px 20px 0 20px">
    <div style="position: relative; width: 128px; height: 128px; display: flex; align-items: center; justify-content: center">
      <div style="position: absolute; inset: 0; border-radius: 999px; background: #FF6B1A; opacity: 0.4; animation: slooinPuls 1.9s ease-out infinite"></div>
      <div style="position: absolute; inset: 10px; border-radius: 999px; background: #FF6B1A; opacity: 0.35; animation: slooinPuls 1.9s ease-out 0.5s infinite"></div>
      <div style="position: relative; width: 98px; height: 98px; border-radius: 999px; background: #FF6B1A; display: flex; align-items: center; justify-content: center; box-shadow: 0 14px 34px rgba(255,107,26,0.4)">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
      <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.02em; color: #17130F">Şimdi buradasın!</div>
      <div style="display: flex; align-items: center; gap: 6px; background: #FFF3EA; border-radius: 999px; padding: 8px 15px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#E85D0F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        <span style="font-size: 14px; font-weight: 600; color: #E85D0F">Moda Sahil Kahvesi</span>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 20px; padding: 34px 20px 0 20px">

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 17px; color: #17130F">Kim görsün?</div>
      <div style="display: flex; flex-direction: column; gap: 9px">
        <div style="display: flex; align-items: center; gap: 13px; background: #FFF8F3; border: 2px solid #FF6B1A; border-radius: 18px; padding: 15px">
          <div style="width: 40px; height: 40px; border-radius: 12px; background: #FFE6D2; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E85D0F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
          </div>
          <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
            <div style="font-weight: 700; font-size: 15px; color: #17130F">Herkese açık</div>
            <div style="font-size: 12.5px; color: #6E6660">Aynı mekândakiler ve takiplerin görür</div>
          </div>
          <div style="width: 22px; height: 22px; border-radius: 999px; background: #FF6B1A; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 13px; background: #FFFFFF; border: 1.5px solid #EFEAE5; border-radius: 18px; padding: 15px">
          <div style="width: 40px; height: 40px; border-radius: 12px; background: #F5F1EC; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6E6660" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          </div>
          <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
            <div style="font-weight: 600; font-size: 15px; color: #17130F">Takipçilerim</div>
            <div style="font-size: 12.5px; color: #6E6660">Yalnızca karşılıklı bağların görür</div>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 13px; background: #FFFFFF; border: 1.5px solid #EFEAE5; border-radius: 18px; padding: 15px">
          <div style="width: 40px; height: 40px; border-radius: 12px; background: #F5F1EC; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6E6660" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </div>
          <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
            <div style="font-weight: 600; font-size: 15px; color: #17130F">Gizli</div>
            <div style="font-size: 12.5px; color: #6E6660">Kimse görmez, yalnızca sana kayıt</div>
          </div>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 17px; color: #17130F">Bir not bırak</div>
      <div style="background: #FAF7F3; border-radius: 18px; padding: 15px; font-size: 14px; color: #A39B93">Ne yapıyorsun, kim gelsin?</div>
    </div>

  </div>

  <div style="padding: 14px 20px 30px 20px">
    <div style="display: flex; align-items: center; justify-content: center; height: 58px; border-radius: 999px; background: #FF6B1A; color: #FFFFFF; font-weight: 700; font-size: 17px; box-shadow: 0 12px 30px rgba(255,107,26,0.38)">Paylaş</div>
  </div>

</div>
</x-dc>
</body>
</html>
