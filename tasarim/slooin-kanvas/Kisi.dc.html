<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>

  <style>
    body { margin: 0; font-family: 'Instrument Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #E85D0F; } a:hover { color: #c74d0a; }
    @keyframes canliNokta { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #FFFFFF; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden">

  <div style="height: 450px; flex-shrink: 0; position: relative; background: linear-gradient(155deg, #E6D3BE 0%, #B98F63 50%, #5E4630 100%)">
    <div style="position: absolute; inset: 0; background: radial-gradient(85% 55% at 30% 15%, rgba(255,246,228,0.6), rgba(255,246,228,0) 60%)"></div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 52%; background: linear-gradient(180deg, rgba(23,19,15,0) 0%, rgba(23,19,15,0.8) 100%)"></div>
    <div style="position: absolute; top: 58px; left: 16px; right: 16px; display: flex; justify-content: space-between">
      <div style="width: 42px; height: 42px; border-radius: 999px; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.35); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </div>
      <div style="width: 42px; height: 42px; border-radius: 999px; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.35); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
      </div>
    </div>
    <div style="position: absolute; left: 20px; right: 20px; bottom: 24px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; gap: 6px; align-self: flex-start; background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.35); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 999px; padding: 6px 12px">
        <span style="width: 7px; height: 7px; border-radius: 999px; background: #FF8C42; display: inline-block; animation: canliNokta 1.6s ease-in-out infinite"></span>
        <span style="font-size: 12px; font-weight: 700; color: #FFFFFF">Şu an seninle aynı mekânda</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -0.02em; color: #FFFFFF">Deniz, 26</div>
        <div style="font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.85)">@deniz.k</div>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 18px; padding: 20px 20px 0 20px; overflow: hidden">

    <div style="font-size: 15px; color: #44403C; line-height: 1.55">Kahve, sahaf, sahil yürüyüşü. Yeni insanlarla tanışmak için buradayım; aynı masaya oturmaktan çekinme.</div>

    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <div style="background: #FAF7F3; border-radius: 999px; padding: 9px 15px; font-size: 13px; font-weight: 600; color: #44403C">Kahve</div>
      <div style="background: #FAF7F3; border-radius: 999px; padding: 9px 15px; font-size: 13px; font-weight: 600; color: #44403C">Plak</div>
      <div style="background: #FAF7F3; border-radius: 999px; padding: 9px 15px; font-size: 13px; font-weight: 600; color: #44403C">Yüzme</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 17px; color: #17130F">Anılar</div>
        <div style="font-size: 13px; font-weight: 600; color: #A39B93">12 mekân</div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <div style="aspect-ratio: 1; border-radius: 16px; position: relative; overflow: hidden; background: linear-gradient(140deg, #EAD9C2, #C89F72)">
          <div style="position: absolute; inset: 0; background: radial-gradient(80% 60% at 35% 25%, rgba(255,244,224,0.55), rgba(255,244,224,0) 65%)"></div>
        </div>
        <div style="aspect-ratio: 1; border-radius: 16px; position: relative; overflow: hidden; background: linear-gradient(140deg, #DCE0D2, #A9B49A)">
          <div style="position: absolute; inset: 0; background: radial-gradient(80% 60% at 30% 25%, rgba(255,255,240,0.5), rgba(255,255,240,0) 65%)"></div>
        </div>
        <div style="aspect-ratio: 1; border-radius: 16px; position: relative; overflow: hidden; background: linear-gradient(140deg, #3E322B, #211A15)">
          <div style="position: absolute; inset: 0; background: radial-gradient(70% 50% at 70% 25%, rgba(255,143,64,0.35), rgba(255,143,64,0) 60%)"></div>
          <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.9)">+9</div>
        </div>
      </div>
    </div>

  </div>

  <div style="display: flex; gap: 10px; padding: 14px 20px 30px 20px">
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 56px; border-radius: 999px; background: #FF6B1A; color: #FFFFFF; font-weight: 700; font-size: 16px; box-shadow: 0 12px 30px rgba(255,107,26,0.38)">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" y1="8" x2="19" y2="14"></line><line x1="22" y1="11" x2="16" y2="11"></line></svg>
      <span>Takip isteği</span>
    </div>
    <div style="width: 56px; height: 56px; border-radius: 999px; background: #FFFFFF; border: 1.5px solid #EFEAE5; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17130F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
